name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          # Paths are repo-root since the 2026-08-15 restructure (#34) moved
          # package.json out of the nested email-ingestor-lib/ subdirectory so
          # `github:` dependents could resolve it. The workflow kept pointing at
          # the old nested path, so every run since has failed at the cache step
          # ("Some specified paths were not resolved") — CI red for a reason.
          # NOTE: .github/dependabot.yml had the SAME stale path and was missed
          # when this was fixed (#36) — Dependabot then aborted for five weeks.
          # Fixed 2026-08-23; tests/dependabot-config.test.js guards it now.
          # unrelated to any code change.
          cache-dependency-path: package-lock.json
      - name: Upgrade npm
        # node-version 22.x ships npm 10.9.8, which has a reproducible arborist
        # crash ("Cannot read properties of null (reading 'edgesOut')" / "git dep
        # preparation failed") when reifying a git dependency that carries its own
        # "prepare" build script — exactly what @perfectcity/telemetry has (tsc).
        # Verified locally: 100% reproducible on npm 10.9.8 regardless of git
        # protocol (ssh or https) or SSH credential availability; not present on
        # npm 11.11.0 with the same Node 22 runtime. Fixed in the sibling
        # git+https protocol change (avoids a separate, real unauthenticated-ssh
        # CI failure mode) but that change alone does NOT fix this crash — both
        # are needed for `npm ci` to be reliably green here.
        run: npm install -g npm@^11
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        # The full suite runs in CI. producer-health.test.js used to be excluded
        # because @perfectcity/telemetry was an optionalDependency on
        # file:../telemetry — a private sibling checkout CI could not obtain. It
        # is now a regular `github:batmanspaz/telemetry` dependency on a public
        # repo, so npm ci installs it and the test's real schema-validation and
        # PII-scanning coverage runs here too, rather than only pre-push.
        run: npx vitest run
