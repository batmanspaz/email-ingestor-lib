name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: email-ingestor-lib/package-lock.json
      - name: Install dependencies
        run: cd email-ingestor-lib && npm ci
      - name: Run tests
        # @perfectcity/telemetry (optionalDependency, file:../telemetry) is a private
        # sibling package CI cannot check out — npm ci above skips it rather than
        # failing. producer-health.test.js imports it directly to exercise its REAL
        # schema validation + PII scanning (deliberately not mocked — mirrors intake's
        # own sluice-dispatch-health.js), so it only runs locally/pre-push where the
        # real sibling checkout is present. Every other test runs in CI same as always.
        run: cd email-ingestor-lib && npx vitest run --exclude tests/producer-health.test.js
