name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: email-ingestor-lib/package-lock.json
      - name: Install dependencies
        run: cd email-ingestor-lib && npm ci
