version: 2
updates:
  - package-ecosystem: "npm"
    # Repo root since the 2026-08-15 restructure (#34) moved package.json out of
    # the nested email-ingestor-lib/ subdirectory. This key was missed at the
    # time and every run aborted with dependency_file_not_found for five weeks —
    # no dependency security updates reached this repo. tests/dependabot-config
    # .test.js now fails the suite if a directory here stops holding a manifest.
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    ignore:
      # PR #42 (2026-09-04) reverted the git+https protocol pin on this dep back
      # to bare "github:batmanspaz/telemetry" — Dependabot doesn't understand the
      # https-pin-to-a-specific-commit workaround for the npm-git-fetcher/arborist
      # crash fixed in PR #47, it just sees a newer commit on the default branch
      # and proposes bumping to it, silently reintroducing the ssh-resolution CI
      # break. Ignore all Dependabot-proposed updates to this dependency; bump it
      # manually (with the same https-protocol pin) when a real update is needed.
      - dependency-name: "@perfectcity/telemetry"
